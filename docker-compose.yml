services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolutionpassword
      POSTGRES_DB: evolution_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_db:
    image: redis:alpine
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=SenhaOficina123
      - TYPEBOT_ENABLED=true
      # Banco PostgreSQL
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://evolution:evolutionpassword@postgres_db:5432/evolution_db?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      # Cache / Fila Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis_db:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
    depends_on:
      - postgres_db
      - redis_db

volumes:
  postgres_data: